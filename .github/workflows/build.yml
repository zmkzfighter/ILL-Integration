name: Build Geode Mod on: push: branches: [ main ] workflow_dispatch: {} jobs: build: strategy: fail-fast: false matrix: include: - name: Win64 target: Win64 runs-on: windows-latest - name: MacOS target: MacOS runs-on: macos-latest runs-on: ${{ matrix.runs-on }} name: Build (${{ matrix.name }}) steps: - uses: actions/checkout@v4 - uses: geode-sdk/build-geode-mod@main id: build with: target: ${{ matrix.target }} - uses: actions/upload-artifact@v4 with: name: ImpossibleLevelsGeode-${{ matrix.name }} path: ${{ steps.build.outputs.build-output }}