name: Build Geode Mod

on:
  push:
    branches:
      - main
    tags:
      # Un tag `vX.Y.Z` declenche en plus le job `release` ci-dessous.
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Une seule build a la fois par ref : un nouveau push annule la precedente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64

          - name: macOS
            os: macos-latest
            target: MacOS

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: Build (${{ matrix.config.name }})
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.config.target }}
          # 'given' = la version de Geode declaree dans mod.json (5.10.1),
          # pour que la CI compile exactement contre ce que le mod annonce.
          sdk: given
          # Necessaire pour que le job 'package' puisse fusionner les
          # binaires des differentes plateformes en un seul .geode.
          combine: true

  package:
    name: Package (.geode multi-plateforme)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Combine the builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ImpossibleLevelsList.geode
          path: ${{ steps.build.outputs.build-output }}

  release:
    name: Release (${{ github.ref_name }})
    runs-on: ubuntu-latest
    needs: package
    # Uniquement sur un push de tag `v*` : les pushs sur main et les pull
    # requests s'arretent au job `package`.
    if: startsWith(github.ref, 'refs/tags/v')

    # Necessaire pour que GITHUB_TOKEN puisse creer la release.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Verifier que le tag correspond a mod.json
        run: |
          # Geode accepte les deux ecritures dans mod.json ("1.0.0" et
          # "v1.0.0") : on retire le 'v' des deux cotes avant de comparer.
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MOD_VERSION="$(jq -r '.version' mod.json)"
          MOD_VERSION="${MOD_VERSION#v}"
          if [ "$TAG_VERSION" != "$MOD_VERSION" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' incoherent avec mod.json (version = $MOD_VERSION)."
            echo "::error::Bump 'version' dans mod.json, recommit, puis retag."
            exit 1
          fi
          echo "Version $MOD_VERSION confirmee."

      - name: Recuperer le .geode construit par le job package
        uses: actions/download-artifact@v8
        with:
          name: ImpossibleLevelsList.geode
          path: dist

      - name: Creer la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Un tag pre-release porte un suffixe : v1.1.0-beta.1, v2.0.0-rc1...
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE="--prerelease" ;;
          esac

          TITLE="Impossible Levels List $GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" dist/*.geode --title "$TITLE" --generate-notes $PRERELEASE
